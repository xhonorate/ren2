id: hub_w04
title: Halloween
location: building_hall
time: evening
present: [alice, claire]
outfits: {alice: housewife, claire: witch}
rating: sfw
intimacy: 0
steps:
  - narr: "Week four. A pumpkin on every third stair, lit; paper bats on the radiator; music from 2B with the door wide. The stairwell smells of hot wax and the wet inside of a pumpkin."
  - say: alice
    expr: grin
    pose: hand_wave
    delivery: excited
    text: "Sweetheart! You came, you came. Don't lift that, I've got it, you hold this. Hold this. Mm."
  - narr: "A paper cup, warm. Her apron is on over a costume with a tail, and the apron is winning. Bella is at the top of the stairs in her own clothes, holding a drink like a doorstop."
  - say: alice
    expr: smile
    pose: hands_hips
    text: "Bella won't dress up. She says she's come as the landlady. I said that's not a costume, honey, and she said watch her."
  - narr: "On the half-landing, something in a cloak with a sewn crest is being asked what it is, for the third time. Yuki explains it again. Nobody gets it. She does not seem to mind."
  - say: alice
    expr: smile
    pose: pointing
    delivery: soft
    text: "The witch by the window has nothing in her hand. That's not allowed in my building. Back in a teeny second, sweetheart."
  - narr: "The witch by the window takes her hat off, looks at it, and puts it back on. The witch is Claire."
  - say: claire
    expr: neutral
    text: "Good evening. I am off duty. I would like that noted. Everyone assumes I did not have to change. I did."
  - say: player
    text: "How did Alice get you here?"
  - say: claire
    expr: shy_smile
    delivery: soft
    text: "She found me in the laundrette and invited me. She did not ask who I was, and she does not know what I do. I would prefer to keep it that way. Tonight I am a witch."
  - narr: "Alice arrives with a cup and steers her toward the pumpkins, and Claire lets it happen. The pumpkins burn down, the party thins to those who live here, and the evening is yours."
  - stage: {present: []}
  - include: hub_choice
next: hub_w05

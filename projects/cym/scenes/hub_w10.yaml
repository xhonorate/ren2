id: hub_w10
title: Last day of term
location: college_corridor
time: afternoon
present: [victoria, yuki]
outfits: {victoria: professor, yuki: casual}
rating: sfw
intimacy: 0
steps:
  - narr: "Week ten. The last day of term, and the corridor is emptying the way a bath does: slowly, then all at once, with a noise. Low winter sun lies along the stone."
  - narr: "Bags on shoulders, half the noticeboard down with the pins left in. Victoria's office door is open at the end, and she is in it, not leaving, watching the term go past."
  - say: victoria
    expr: smug
    text: "Two weeks, boy. The college will survive it. I make no such promise for the reading."
  - say: player
    text: "Happy Christmas, Professor."
  - say: victoria
    expr: smile
    delivery: soft
    text: "How quaint. Yes. And to you."
  - exit: victoria
  - narr: "She goes back in, and the door stays open. Yuki is at the top of the stairs with her coat on and both hands behind her back: something wrapped, the paper creased from holding."
  - say: yuki
    expr: worried
    pose: hands_behind
    delivery: soft
    text: "H-hi. You're— yes. Last day. Sorry. Happy holidays. If you— yes."
  - say: player
    text: "What's behind your back?"
  - say: yuki
    expr: embarrassed
    pose: shy_fidget
    text: "Nothing. A thing. It's for— someone. Later. Sorry. I'll see you at the building. You'll be at the building."
  - narr: "She goes down with it still behind her back and does not give it to you, and you decide not to know what it is. Two weeks with nowhere you have to be, and tonight is yours."
  - exit: yuki
  - include: hub_choice
next: c02_break

# The hub's choice block, spliced into every hub scene with `- include: hub_choice`.
# Each option runs that route's next spoke (descending step checks so a spoke that
# just ran does not chain into the next), then asks the true-route question when
# her ninth scene has just returned. Generated once; edit by hand if the cast changes.
- choice:
    prompt: Whose evening?
    options:
    - text: Knock on 2B.
      requires: flags.alice_step < 9
      steps:
      - if: flags.alice_step == 8
        then:
        - call: alice_s09
      - if: flags.alice_step == 7
        then:
        - call: alice_s08
      - if: flags.alice_step == 6
        then:
        - call: alice_s07
      - if: flags.alice_step == 5
        then:
        - call: alice_s06
      - if: flags.alice_step == 4
        then:
        - call: alice_s05
      - if: flags.alice_step == 3
        then:
        - call: alice_s04
      - if: flags.alice_step == 2
        then:
        - call: alice_s03
      - if: flags.alice_step == 1
        then:
        - call: alice_s02
      - if: flags.alice_step == 0
        then:
        - call: alice_s01
      - if: flags.alice_step == 9 and not flags.alice_true
        then:
        - choice:
            prompt: Is Alice the one?
            options:
            - text: Yes. Alice.
              effects:
                set:
                  alice_true: true
              goto: alice_finale
            - text: Not yet.

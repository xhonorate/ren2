- scene: natalie_s01
  summary: "The second home visit, in uniform with the clipboard: eleven minutes, blood pressure, ribs (still no lifting), the concussion list. She skips 'Sleeping?' and reads the bed instead (duvet out of its bag at last, pillow on the floor): two hours, maybe three, in pieces; 'You're healing fine. You're sleeping like garbage. One of those I can fix.' The pupil check with the penlight runs a second past what the job needs and she does not step back. She prescribes walking (twenty out, twenty back, then bed with the light off, every night until she says) and writes it down; he argues or agrees. At the window she points at the river path and learns he has walked it since the night of her first visit, and slept. He asks whether she sleeps (five hours, in one piece; not on his list). Twelve minutes again at the door, and this time she does not frown. He gets his coat."
  characters:
    natalie:
      knows: ["he sleeps two or three hours a night, in pieces (read off the pushed-off duvet and the pillow on the floor; he did not deny it)", "he found the river path on his own the night of her first visit, and slept after it", "whether he argued the prescription ('Walking isn't a treatment') or took it ('Okay. I'll walk.')", "he asked whether she sleeps"]
      hiding: ["that the pupil check ran a second past the job and she chose not to step back", "that she was pleased he had already found the path (it showed for a moment, then went)", "that she flagged his injuries as hours old and called it in (still unsaid; he did not ask this visit)"]
      address: "no name; 'you'; instructions as sentences; counts the minutes down (eleven, nine, six, three, two)"
      relationship: "his community nurse, weekly, same time; clinical, one minute over again and no longer frowning at it; the penlight moment is the first thing between them that was not on the list"
      outfit: nurse
      last_seen: player_apartment
  flags_set: {natalie_step: 1}
  affection_delta: {natalie: +2}
  threads: ["natalie +2 only if he agreed to walk (default path); +1 if he argued ('Sedatives on a concussion, no. Legs, yes.')", "prescribed: twenty minutes out, twenty back, then bed with the light off, every night until she says; it is written on the clipboard, the first thing written since the number", "she knows he walks the river path; it is below his window and comes back to his door", "she sleeps five hours in one piece and said so; nobody asks her that", "Natalie still has something she cannot tell him (not raised this visit)", "no lifting still stands; the dressing is gone and the wound was not discussed", "she gave him twelve minutes again and did not frown at the watch; the pen stopped once, for her, when he asked if she sleeps"]
- scene: natalie_s02
  summary: "She knocks late, straight off a twelve-hour shift and still in uniform; his light was on from the river path, which is her way home. He has walked every night (three hours, four once, in pieces). She is not here for the list: she says what will happen (he lies down, she sits, hands hers, his stay where she puts them, he counts down from a hundred and does not reach the bottom), calls it the most efficient way to make him sleep, and asks if that is acceptable; he says yes, or asks whether this is the job (no; the job ended an hour ago; the question stands) and then yes. She stands over the bed and takes the gloves off; he does what he is told and finds it a relief. Pulse ninety, breathing twenty, she wants twelve; he asks her to stay until he is asleep (she had already decided) or tells her to go home (she has until he is under, however long that is). He counts, she counts his breathing down, the other hand goes unexplained, and somewhere in the eighties he is gone. Morning: a whole night in one piece; on the table the clipboard, with a time and 'eight minutes' written under 'Sleeping?', and under that the word she did not say the first time: Sleep."
  characters:
    natalie:
      knows: ["the walking helped (three hours, four once, still in pieces) and was not enough", "he said yes to her terms, plainly or after asking whether it was the job", "whether he asked her to stay until he slept or told her to go home", "that he does what he is told when it is her telling him, and that it eased him (she watched it happen)", "it took eight minutes; she timed it"]
      hiding: ["that she waited for his answer, which she has never done for anything (it showed)", "that her way home runs under his window and she looks up at it", "that 'There you are' was tender and she heard herself say it", "that she flagged his injuries as hours old and called it in (still unsaid)"]
      address: "no name; 'you'; instructions as sentences; counted his breathing down (twenty, sixteen, fourteen, twelve); 'Good.' when he does as he is told"
      relationship: "past the job now, on her terms and with eyes open ('This is me, after it'); she put him to sleep with her hands and stayed until he was under; the register is set (she leads, he does as he is told, she does not call it anything); first intimate scene done, clothes on"
      outfit: nurse
      last_seen: player_apartment
  flags_set: {natalie_step: 2}
  affection_delta: {natalie: +2}
  threads: ["natalie +1 for 'Yes.' and +1 for 'Stay until I'm asleep.' (default path: both); 0 for 'Is this the job?' and 'Go home'", "the clipboard is on his table with 'Sleeping?' answered for the first time (a time, eight minutes in brackets, and the word Sleep); she left it there", "her way home from the hospital is the river path under his window; she can see whether his light is on", "the gloves came off for the first time; her hands are warm", "she has still not said what she flagged or that she called it in", "he slept a whole night for the first time since the hospital; nobody else knows yet", "'I've got until you're under. However long that is': the first time she had no number for something"]

- scene: bella_s01
  summary: "Rent day. She is on the landing when he opens his door, counts the cash twice on the windowsill ('everyone gets twice'), and tells him she hears the hot tap at two and three in the morning through the pipes; hot water is her bill. A heater is waiting on the turn of the stairs, electric, on his meter, 'so you stop running up my bill'; she sends him down for it despite 2B's no-lifting note and watches him carry it up the whole flight without helping or looking away. In 2A she tells him where it goes (by the bed, not the window), has him plug it in, takes his wrist and holds his hand to the grille until the heat is a fact, and keeps hold a second past the point. At the door he thanks her (she refuses it: nothing in the building is free) or asks what it will cost him ('Nothing. Yet. I'll let you know when.'). She is on the stairs before the door shuts; that night the tap stays off."
  characters:
    bella:
      knows: ["he pays in cash, on the first, counted before she counts it", "he has been running the hot tap at two and three in the morning (she hears the pipes from downstairs)", "he carried the heater up the full flight with both hands and did not put it down", "which he said at the door: thank you, or what it will cost him"]
      hiding: ["that the heater is for him, not for the bill (she looked at the window before saying it)", "that the heater is not new and was warming a room somewhere until today (world.md gives her office a space heater; not said on screen)", "that she listens to the pipes for him at night", "that she waited at the door for him to say something"]
      address: "'kid'; orders, not requests ('Hand.', 'Plug it in.', 'Off anyway.'); repeats the important word; ends by leaving"
      relationship: "his landlady; has now stood in 2A and told him where things go; held his wrist a second past the point and looked at the heater instead of him; 'Nothing. Yet.' (cost branch)"
      outfit: casual
      last_seen: player_apartment
  flags_set: {bella_step: 1}
  affection_delta: {bella: +1}
  threads: ["bella +1 only if he asked what it would cost him (default path); on 'Thank you' she refused the thanks and gave nothing back", "the heater is by the bed in 2A, on his meter: off when out, off when asleep; the hot tap stays off at night now", "'Nothing. Yet. I'll let you know when.' (cost branch): the price is still owed", "she hears the pipes from downstairs; she knows he does not sleep and said so", "2B's no-lifting note on the board: she has taken it down twice and made him lift anyway, watching every step", "the heater is used (cord wound round it, dust on the grille); where it came from is not said; her office has one per world.md", "the first charged touch: her hand on his wrist at the grille, a second past the point, and then another"]
- scene: bella_s02
  summary: "Six a.m. at the gym; she said six on the stairs and did not ask it. He is one minute late ('I said six. I didn't ask six.'). She keeps him off the weights because of the note and stretches him instead: her hands at his wrists, flat between his shoulders, on his hips; hurt says stop and she stops; he counts to ten out loud. At the mirror, 'Look at you', and she is looking at him looking. When the gym empties she changes with the door open and keeps talking: he likes being told, and she wants it said out loud; he says yes (or 'I think so', and she makes him say it again). Her rules: she tells, he does; he can say no once and she stops; he never thanks her; he is hers at six every day. He looks up through the open door or keeps his eyes on the floor, and she knows either way. She comes out in the tank top and skirt, takes his chin, kisses him once, hard, and stops it herself ('That's the first. Not the second. The first.'), and leaves him to drink all his water."
  characters:
    bella:
      knows: ["he came at six because she said so, and was one minute late", "he likes being told what to do and has said so out loud", "whether he said yes straight off or 'I think so' first", "whether he looked through the changing-room door or kept his eyes on the floor", "he stretches further when she says so and stops when told; he has not needed the stop word"]
      hiding: ["that she left the changing-room door open on purpose and was listening for whether he looked ('I'd have known')", "that she stopped the kiss herself because she wanted to be the one who did", "that the gym is the one place she is not the building (she said 'no rent in here', nothing more)"]
      address: "'kid'; orders, and now terms ('I tell you, you do it'); talks about him to his face ('He says yes', 'There he is'); ends by leaving"
      relationship: "his landlady and, since this morning, the one who tells him; the register accepted out loud, with a stop word; one kiss, hers to start and stop; he is hers at six every day and she does not care about the rest of the day"
      outfit: casual
      last_seen: gym
  flags_set: {bella_step: 2}
  affection_delta: {bella: +2}
  threads: ["bella +1 only if he answered 'Yes. I like it.' and +1 only if he looked up (default path: both); on 'I think so' she made him say it again; on the floor she said the door was open for a reason", "her terms: she tells, he does; he can say no once and she stops; he never thanks her ('thanking's for people who did you a favour')", "six a.m., every day, not one past; 'the rest of the day I don't care what you do'", "the first kiss was hers: once, hard, she stopped it; 'That's the first. Not the second. The first.'", "the no-lifting note still stands at the gym: stretching, not lifting", "'Hurt says stop, and I stop': the stop word is set and he has not needed it", "the tattoo on her thigh: he has seen the edge of it under the hem of the shorts, nothing more", "'No rent in here. No radiator.': the gym as the place that is not the building, said once; the rest is for later", "the water bottle: he drank all of it because she said to, and noticed that was why"]

- scene: claire_s01
  summary: "A session at her office in the afternoon: the two chairs already close, the plant, the blind half down, the tissue box full on the table between them. He talks around the letters (the cupboard door that stuck, the shoebox soft at the corners, kept in order, the same hand getting older on the envelopes, every one opened before him) and she restates each thing back kinder; he says he will not cry and she leaves the tissues where they are because the refusing is doing something for him. He remembers packing the bag and the zip that stuck, then the wall; she tells him to hold on to the bag, not the wall. The hour runs long and she does not mention it; he asks why she never writes anything down (she would be looking at the page; she writes it at home afterwards, all of it), or says it is past the hour, or lets it run. She ends on 'the hour I meant' and 'I am not supposed to say I'm glad you came'; the invoice will say fifty minutes."
  characters:
    claire:
      knows: ["the cupboard door stuck and he pulled it twice; the box was a shoebox, soft at the corners; the letters were kept in order", "the same handwriting on every envelope, getting older; he has read the envelopes closely and walks around the insides", "every letter was opened before him", "he remembers packing a bag, the zip that stuck halfway, and then the wall", "he looks at the plant instead of her; he will not use the tissues and says he is not going to cry", "which he chose at the end of the hour: asked about the notebook, said it was past the hour, or let it run"]
      hiding: ["that she writes every session down at home afterwards, all of it, and is not sure her memory for what he says is professional (said only on the notebook branch)", "that she extends the hour on purpose and bills fifty minutes", "that she is glad he came (said, as 'not supposed to say'); that she has noticed she keeps saying such things"]
      address: "no name; 'you'; full even sentences; restates back kinder; 'if that is acceptable to you'"
      relationship: "his therapist, weekly at her office; the hour runs long now and she does not say so; she keeps saying things she is not supposed to and has admitted noticing it"
      outfit: goth
      last_seen: claire_office
  flags_set: {claire_step: 1}
  affection_delta: {claire: +1}
  threads: ["claire +1 only if he asked why she never writes anything down (default path)", "the letters: the envelopes read closely, the insides walked around; he has not said whose hand it is; he does not say where they are now", "the bag and the zip are remembered; the wall after them stays; she told him to hold on to the bag, not the wall", "the tissue box stays on the table, full; 'you have the plant'", "'Same chairs. They will not have moved.'; the invoice will say fifty minutes", "on the ward she stood at seven exactly; here she lets the hour run"]
- scene: claire_s02
  summary: "Night at the laundrette on the corner: she is there first, in the band shirt, pleated skirt and fishnets, her arms bare for the first time (snakes up one, a thorned vine up the other); the tattoos are a conversation for another time, in order. He asks about the band and she tells him about herself, flatly and in order, because he asked (or because she would like to): black at thirteen, a name they used for five years, shutting off, the grey year she called fine and everybody let her, the woman in a cardigan with a tissue box she did not use who sat with her an hour a week and wrote nothing down, and wanting to be the person in the chair. He restates it back kinder ('You got through a year') and she lets him keep the line. She stays for his wash and his dryer, folds his shirts without asking, and their hands meet in the basket three times, the third time staying; 'this is not professional; none of it is going on the invoice.' She offers to walk him back; he lets her (she walks on the road side and waits until he is inside), or walks her home the other way up the main street instead."
  characters:
    claire:
      knows: ["he does his laundry at the corner laundrette at night", "he did not recognise her out of the dress at first; he looked at her arms and apologised for it", "he asked about the band, and asked her to tell him (or told her she did not have to)", "he used her own restating line on her ('You got through a year. That's not nothing.')", "he folds his shirts wrong", "whether he let her walk him back or walked her home"]
      hiding: ["what the snakes, the vine and the rest of the ink mark ('another time, in order')", "what the black clothes were for (only 'before I knew why')", "that staying for both his wash and his dryer was a choice", "that her hand staying in the basket was deliberate ('I am not going to make anything of it tonight')"]
      address: "no name; 'you'; full even sentences; restates back kinder; 'either is allowed'"
      relationship: "his therapist and, off hours, something she has named as not professional; she has told him about herself for the first time; hands in the basket, nothing more; she walked him to the building's door (default) or he walked her to hers"
      outfit: casual
      last_seen: laundrette
  flags_set: {claire_step: 2}
  affection_delta: {claire: +2}
  threads: ["claire +1 if he said 'Tell me. If you want to.' and +1 if he let her walk him back (default path: both)", "the tattoos are promised 'another time, in order', not tonight (Ink, s08); he has seen the snakes and the vine, not the shoulders, stomach or back", "the black clothes: 'before I knew why'; the why is not told yet (s06)", "her story, in order: the school name for five years; shutting off; the grey year; the woman in the cardigan who wrote nothing down, which is why Claire does not either", "her flat is the other way up the main street, twenty minutes; on the walk-her-home branch he has seen her door and she did not go in straight away", "'None of it is going on the invoice'", "his shirts are folded her way now and he has not unfolded one"]
- scene: claire_s03
  summary: "One in the morning on the river path, at the last streetlight before the bridge; she walks there too, most nights, since before the grey year (the one thing from then she kept), the path running past the end of her street. She says, not asks, that he is not sleeping either; he says 'some' or 'not really'. Her arm goes through his without comment and she walks him back: 'you may lean'; she has never passed anyone at one in the morning; tonight she got as far as the laundrette and stopped filing the day; the invoice stops at the office door and she is thinking about where the rest of it stops, which is hers to decide. On the landing at his door, close, neither stepping in nor back, she ends the almost by saying the time (twenty past one). He asks her in (yes, and no, because the first answer is yes; goodnight said from where she stands) or says 'Goodnight, Claire' (his first use of her name; she will walk home thinking about it). He sleeps more of the night than usual."
  characters:
    claire:
      knows: ["he walks the river path at one when he cannot sleep; he said 'some' or 'not really' to not sleeping", "he asked whether this is on the invoice", "he says 'okay' the way other people say thank you", "whether he asked her in, or said goodnight with her name", "which door on the landing is his"]
      hiding: ["that the answer to 'do you want to come in' is yes (said only on that branch)", "that she has not decided where the rest of it stops (she has said she is thinking; not what she is thinking)", "why the walk home will feel shorter"]
      address: "no name; 'you'; restates back kinder; on the goodnight branch he has said 'Claire' for the first time"
      relationship: "therapist off the invoice; her arm through his without comment, walked him home; the almost at his door, ended by her saying the time; she has named the deciding as hers to do"
      outfit: casual
      last_seen: building_hall
  flags_set: {claire_step: 3}
  affection_delta: {claire: +2}
  threads: ["claire +1 if he said 'No. Not really.' and +1 if he asked her in (default path: both)", "she walks the river path most nights; it passes the end of her street; she walks until she is tired and then back", "'the invoice stops at the office door'; where the rest of it stops is not decided, and deciding is hers", "the almost on the landing, ended with 'It is twenty past one'; nobody kissed anybody", "'Goodnight, Claire' branch only: he has said her name once", "he slept more of the night than usual after she left"]
- scene: claire_s04
  summary: "Memory work in her office, slowly and with her voice: back to the cupboard with her this time, 'stop at any word' ('plant' would also work). The door that sticks, the shoebox on the floor, the top letter opened with his name on it (left unread), his room, the bag, the box that goes in last and does not fit flat, the zip, and then a hand on the strap: hers, his step-mother's. She stops it there, before whatever was said and before the stairs; he says he could go further, or 'okay'. Grounding (the office, the plant). His hands will not stay still and she gets out of her chair and holds him, eyes open, until his hands let go. Back in her chair, flat and precise: she should not have, she knows which rule, she is going to do it again, and one kiss to prove it. He asks what happens to her if someone finds out (the job, then the licence; it is hers to carry and he is not to pick it up) or says he will not tell (what worries her is that she is not worried). 'That is the hour. It was a good deal more than the hour.'"
  characters:
    claire:
      knows: ["the memory as far as the strap: the study door, the shoebox on the floor, the top letter opened with his name on it, the bag (clothes, charger, the box last, not flat), the zip, his step-mother's hand on the strap; she was saying something he could nearly hear", "he said 'Hers. My step-mother's.' in this room, the first time he has named her role on this route", "he could go further and did not (or said 'okay' and let her stop it)", "his hands would not stay still; he did not use the tissues; he let her hold him", "whether he asked what happens to her, or said he would not tell"]
      hiding: ["the stairs: she does not know what comes after the hand either, and she did not ask", "the paragraph number of the rule she has broken (she could cite it)", "that she has been reciting the rule on the walk home since the laundrette (said), and what else she thinks on those walks", "that she checked for worry several times and found none (said only on the won't-tell branch)"]
      address: "no name; 'you'; restates back kinder; 'if that is acceptable to you'; 'come back now'"
      relationship: "his therapist, and past the line with her eyes open: she has held him in her office and kissed him once and said she will again; what it costs her is hers to carry; next time is 'same chairs'"
      outfit: goth
      last_seen: claire_office
  flags_set: {claire_step: 4}
  affection_delta: {claire: +2}
  threads: ["claire +1 if he said 'Okay.' when she stopped the memory and +1 if he asked what happens if someone finds out (default path: both)", "the memory now reaches the step-mother's hand on the strap, and she was saying something; the stairs are still behind the wall (s07)", "the letters: the top one opened, his name on it, left unread in the memory; the box went into the bag last and did not fit flat (the bag he packed had the letters in it)", "she should not have and she will again; one kiss, proved; 'fair is a different conversation, and we will have it, and not today' (ask branch)", "what it costs her: the job, then the licence, then 'the thing that happens to people who have only ever been one thing'; mine to carry, you are not to pick it up (ask branch)", "the tissue box is still full; 'it was never going to be the tissues'", "the rule she has broken has a paragraph number; the referral is the next thing she owes him (s05)"]

      hiding: ["the rest of 'not like this' (what Alice does for him is different, and she has noticed)", "that she enforces Alice's rule because she cannot bear him hurt"]
      address: "'you', barely; 'sorry' for the bags, the stairs, the milk; stutters on the first word of goodnight"

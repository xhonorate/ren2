      hiding: ["that she billed fifty minutes for the hour", "that she is already invested (she said she looked forward to this, and that she was not supposed to say so)"]
      address: "no name; 'you'; full even sentences; restates what he said back, kinder"
      relationship: "his therapist from tonight; weekly, Thursdays at her office after discharge; careful, and already a little past careful (the chair moved closer twice)"
      outfit: goth
      last_seen: hospital_room

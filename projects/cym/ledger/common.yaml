- scene: c03_alone
  summary: "The alone ending: the river path in the morning for the first time, every streetlight off, the bench dry, the bridge in sun and the river low. He takes stock: he sleeps most nights and knows why when he does not; a key, a seat, a half-shared window seat, a plate on the mat some nights, a heater, a coat with a hood, a timetable square, a card signed with one letter, seven people who would notice. He did not choose, and the not-choosing was a thing he did on purpose; it feels like having time. He walks to the bridge, where he has always turned back, and keeps going; the door is on the latch, and the summer starts about there."

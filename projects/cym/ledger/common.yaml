- scene: c01_s06
  summary: "Natalie's first community visit to 2A, in uniform with the clipboard: blood pressure, the dressing (clean; sutures out Friday; keep it dry), ribs (he lifted boxes; six weeks, no lifting), then the concussion list. On 'Sleeping?' he says fine, or not much, or asks if she wants the real answer; whichever, she looks at the made bed with the duvet still in its bag on the chair and writes nothing down. She reports Alice asked on the stairs whether he had eaten ('not my department'; Alice said it was hers and gave her a biscuit), confirms there is still more she cannot tell him, looks in his fridge, and leaves after twelve minutes with 'Tuesday. Eat. Don't lift.' and a fourth word unsaid. At one in the morning he finds the door at the back of the hall and the river path; the streetlights come on one at a time ahead of him; he walks to the bridge and back until he is tired, and sleeps in the bed for the first time."
  characters:
    natalie:
      knows: ["he is not sleeping (seen: the made bed, the duvet in its bag; and, on two branches, he said so)", "he carried boxes up with cracked ribs", "what is in his fridge", "he remembers her warning that there is more she cannot say, and asked again"]
      hiding: ["that she flagged his injuries as hours old and called it in ('There is. Still can't.')", "that she noticed the bed and chose not to say the fourth word", "that she gave him twelve minutes and frowned at the watch for it"]
      address: "no name; 'you'; instructions; counts the minutes down"
      relationship: "his community nurse now; Tuesdays, same time, weekly until she says; clinical, and already one minute over"
      outfit: nurse
      last_seen: player_apartment

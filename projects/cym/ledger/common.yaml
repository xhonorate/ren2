- scene: c03_lock
  summary: "The landing on the last evening of term with the window open for the first time (it took both hands) and the river coming in; the paint has lost its smell, a second plant sits beside the first, the radiator is only a radiator, and the building is quiet the way it is when everyone in it is listening. He has slept whole nights, enough to know the difference; the summer is the first time since the ward nobody has arranged for him. One choice: each woman whose route is complete, by name, or 'No one. Not yet.' into the alone ending."

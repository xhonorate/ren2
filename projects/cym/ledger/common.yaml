- scene: c01_s07
  summary: "Breakfast at the diner at seven; Diana has ordered eggs and toast before he sits and holds her coffee without drinking it. The status: the police have the step-mother's statement and the hospital's report ('the report is longer; that's all I'll say'); his belongings are in a box with his name on it in a cupboard in Diana's office, and only she has the key. The step-mother does not accept the no-contact order and has rung the station twice and Diana once; her voice goes flat: if she tries, she gets to Diana first; 'this is my problem, not yours; say it back.' He asks what is in the box (clothes, a dead phone, the bag he packed, 'some papers the police want a bit longer'), or lets it go, or asks whether the step-mother can get at any of it (not a sock). She asks what he ate (soup twice, and the nurse got the biscuit), gives him her personal number, pays, and sends him to his seminar with the other half of breakfast wrapped in his bag."
  characters:
    diana:
      knows: ["which he chose about the box: asked, let it go, or asked about the step-mother (she filed it)", "he remembers packing the bag, and nothing after its weight (ask branch)", "he ate soup twice yesterday; Alice is feeding him; Natalie visited", "he asked whether her personal number was allowed"]
      hiding: ["that the 'papers' are the letters, and that the police have them", "what the step-mother said on the phone", "that the hospital report flags the hours before the call (she said only that it is longer)", "how far past her remit this already is ('allowed is a thing that happens to other people')"]
      address: "'sweetie', 'honey'; 'Here's what's going to happen'; makes him say things back"
      relationship: "social worker and already more; she carries the step-mother; he has her personal number and an instruction not to answer unknown calls"
      outfit: office
      last_seen: diner

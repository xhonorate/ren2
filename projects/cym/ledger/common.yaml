- scene: c01_s03
  summary: "Claire's first session, on the ward at six. She moves the chair closer (nobody had), sits with the notebook shut and tells him he does not have to talk but she would like him to stay the hour. He tells her about the box of letters without meaning to, and the wall after it; she restates it back kinder, says he need not remember the rest tonight, and that she will not ask about the house. After discharge the sessions move to her office on Thursdays. She leaves on the hour exactly; weeks later he sees she billed fifty minutes."

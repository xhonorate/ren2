- scene: yuki_s01
  summary: "The library's quiet floor, and the window seat past the end of the stacks that Yuki thinks nobody else knows about. She moves her bag (two tries) and lets him sit, which nobody has before. Her chapter is colour-coded: blue what the author says, green what he means, pink where she disagrees (a lot of pink; she would never say so in class), yellow for the questions she never asks. He borrows the pink or keeps to one pen; she hums three notes, catches herself once and not the second time. When the light reaches her she is reading a manga as a reward for finishing the chapter, sleeves pulled over her hands; he asks about the ribbon (old, it frays, she sews it back; 'Is it wrong?' 'It's not wrong.') or about the book. The floor closes at six; she says the seat is here most days if he wants it, and at the bottom of the stairs she holds the door for him."
  characters:
    yuki:
      knows: ["he came looking for a desk and found her seat; he asked before he sat", "he did not mind the humming, twice", "he said the ribbon is not wrong (ribbon branch); he knows the one-chapter-for-one-chapter rule and will not tell (book branch)", "he said 'I'd like that' when she offered the seat for most days"]
      hiding: ["the second sentence; it got as far as her mouth this time", "the pink: she thinks the author is wrong and will not say so in a room with people in it", "the yellow pen: the questions she wants to ask and never does", "that she sews (said only of the ribbon); nothing yet about the homes, aging out, Diana or the conventions"]
      address: "'you' now, without flinching; 'sorry' still for things that are not hers; offers exits ('if you wanted it', 'you don't have to')"
      relationship: "study partner by invitation; the window seat is his too, 'most days'; she held the door for him; nothing said, all of it visible"
      outfit: casual
      last_seen: college_library
  flags_set: {yuki_step: 1}
  affection_delta: {yuki: +2}
  threads: ["yuki +1 for borrowing the pink pen, +1 for asking about the ribbon (default path: both)", "the window seat past the end of the stacks is theirs now, 'most days'; the quiet floor closes at six", "the pen system: blue says, green means, pink disagrees, yellow asks; the yellow questions have never been asked and the pink has never been said in class (s08's presentation pays this)", "she reads manga as a reward, one chapter for one chapter; 'please don't tell'", "the ribbon: old, frays, re-sewn, 'the same one'; she sews, and the sewing machine is still unmentioned (s02 owns it)", "the second sentence reached her mouth; she held the door at the bottom of the stairs", "nothing about Diana, the homes, aging out or the conventions yet; s02 owns the telling"]
- scene: yuki_s02
  summary: "On the third-floor stairs she asks him up on a pretext (the fairy lights' hook), confesses in her doorway that it was a lie (she stands on the bed to reach it) and that she has tea and has been trying to say so since the library. 3C: the one chair is his, the bed is hers; the sewing machine was in a cupboard in the second foster home and has moved with her through all four since ('the people change and the machine doesn't'). Carrying the tea past the dress form her sleeve pulls the sheet: black satin, a white tuft, one long ear; both reach for it, his hand under hers for two seconds, then she covers it. She corrects the corridor's lie: Diana checks on her, not the building; she aged out ('there's a birthday; before it a bed and a worker and a file; after it there isn't'); Diana found the room and the college and still comes up, which she does for no one once they are out. Hand on the sheet, not looking at him: 'Except you'; Diana told her someone was coming and was in his room a long time after the boxes, heard through the floor. He asks what the suit is for (conventions; nobody knows anybody; she is somebody else for an afternoon) or lets it stay under the sheet (she will tell him, soon). 'The tea was real. The hook wasn't.' Her door does not close behind him."
  characters:
    yuki:
      knows: ["he came for the tea, not the hook (tea branch: he said so)", "he asked about the machine and the homes and did not flinch; he said aging out does not sound normal", "he knows Diana still checks on her and that 'the building' was a lie", "ask branch: he knows about the conventions and said it does not sound strange; sheet branch: he said he will not ask until she wants him to", "he sat in her chair; he thanked her for the tea"]
      hiding: ["what the suit is (a bunny suit; he has seen an ear, a tail and black satin under the sheet) and, on the sheet branch, what it is for", "that she left his hand under hers on the sheet for two seconds on purpose", "the thing she has actually been trying to say; the Diana thing was what the tea was 'for', and it is not the real one (s03's)", "her list; nothing of it yet"]
      address: "'you' freely now; 'sorry' for the lie, the size of the room, the whole cup; offers exits ('you can go, that's okay', 'if that's okay')"
      relationship: "he has been up to 3C and the chair is his; she told him the homes and Diana, which nobody at the college or in the building knows; his hand under hers on the sheet; her door left open behind him until the turn of the stairs"
      outfit: casual
      last_seen: yuki_apartment
  flags_set: {yuki_step: 2}
  affection_delta: {yuki: +1}
  threads: ["yuki +1 for 'I'd have come for the tea' (default path); +1 for letting the suit stay under the sheet (not default: the default path asked what it is for, +0)", "the suit: black satin, white tail, long ears, unfinished, under a bedsheet on the dress form by the window; she pulled the sheet back over it twice and kept her hand on it", "ask branch: he knows about the conventions ('nobody knows anybody; that's the point'); sheet branch: she promised to tell him soon; s04's asking must work from either", "the sewing machine came from the second foster home's cupboard; four homes; it came with her every time; the chair came with it; 'you can wait, or you can make something'", "aged out: 'there's a birthday'; Diana found the room and the college, comes up not often but often enough, is not supposed to, and keeps no one once they are out except Yuki, and him", "3C is directly above 2A; Yuki heard Diana stay in his room a long time after the boxes on move-in day", "the hook was a lie she confessed in the doorway; 'the tea was real'; 'I don't know how people end this part'", "his hand under hers on the sheet for two seconds; neither said anything about it", "her door left open until he reached the turn of the stairs"]
- scene: yuki_s03
  summary: "The short way home ends at the step and she asks for the long way with the same words as the first day ('I don't have a second one'). The long way is the river path. She likes it loud because she thinks too much; she hears the back door when he goes out at night and does not want it closed quieter, or she won't know he is all right. In the middle of the bridge she makes a rule (say it before the first streetlight comes on) and says it in one breath: she has liked him since the pen, before the pen; the seat was so he'd sit there, the tea so he'd come up, the long way so she could say it; he can go. Then she hides in her cardigan collar up to the eyes. He lets her stay in there and says it back to the collar, or asks her to look at him and waits without reaching for the collar until she comes out on her own; either way he says he likes her too, since the pen. The first light comes on; she holds out a sleeve; by the second light it is her hand, all the way back ('don't ask again; just yes'). The middle she forgot was 'you don't have to say it back'. On the back step, level with him, the moment is there and she goes up before it: 'I said it. I'm not taking it back.'"
  characters:
    yuki:
      knows: ["he likes her too, since the pen; 'I didn't know what it was called until the seat' (both branches)", "he comes down to the river when he cannot sleep; he told her, and she already knew from the door", "hide branch: he let her stay in the collar and said it twice when she asked; look branch: he waited, did not reach for the collar, and she came out on her own", "his hand in hers from the bridge to the back door; he asked once whether it was okay and she told him not to ask again"]
      hiding: ["the rest of what she had in order to say (she admits she lost the middle, not what else was on it)", "what she went up the stairs before: the kiss she did not take on the step", "the suit and the conventions stand as s02 left them (ask branch: he knows what the suit is for; sheet branch: she promised soon)", "her list; nothing of it yet"]
      address: "'you', and his eyes held now; 'sorry', then 'not sorry'; still offers exits ('you can go', 'you don't have to') and no longer means them"
      relationship: "declared, both ways, on the bridge; held hands all the way back; on the back step she stood level with him and went upstairs before the kiss; 'I'm not taking it back'"
      outfit: casual
      last_seen: river_path
  flags_set: {yuki_step: 3}
  affection_delta: {yuki: +1}
  threads: ["yuki +1 for letting her hide (default path); +2 for 'Yuki. Look at me.', on which she came out of the collar on her own", "both branches: he said 'I like you too. Since the pen.'; hide branch she asked him to say it again; look branch she did not go back in", "the rule she made on the bridge: say it before the first streetlight; she did, and the light came on after", "held hands all the way back: the sleeve first, the hand by the second light; 'don't ask again, just yes'", "the back door: she hears it when he goes out at night and told him not to close it quieter", "the step: level with him, the moment there, she went up before it; the first kiss is hers to take (s04)", "the middle she forgot: 'you don't have to say it back'; 'it's late for it now'", "the suit under the sheet and the conventions are as s02 left them; s04's asking must work from either branch"]
- scene: yuki_s04
  summary: "Three tries on the stairs ('D-do you— never mind', 'that's the second try, you saw', 'I can't say this part, I'm going up') and then a text: a hall, a convention, she will be in the suit, nobody there knows her, he would, this once, he doesn't have to; a minute later, 'Please come'; he sends one word. The hall: she finds him in the finished suit and heels that put her level with him, and in it she does not stutter and does not say sorry ('She's in the bag with my cardigan. She'll be back at five'); fourteen people have looked and she has not apologised once. He says she is not saying sorry, or that she is taller, or that the suit is finished (sewn after the bridge, the tail all night). Behind the stage curtain, where she waits when it is too much, she starts to say what being her is like ('being allowed') and kisses him before she finishes, then thinks about it: both hands over her mouth, the stutter and the sorry back, 'I'm both'. He tells her she was right to (she kisses him again, slower, on purpose, and laughs into it) or asks for her hand (her forehead on his shoulder; 'this is enough for one afternoon'). She goes to change back into herself and asks him to wait: 'Fifteen. You don't count. You're the one who knows both.'"
  characters:
    yuki:
      knows: ["he came because she asked, on the fourth try (the text)", "he watched her not stutter and not apologise for an afternoon; sorry branch: he said so; taller branch: he saw she cannot walk in the heels; finished branch: he saw the tail", "she kissed him first and he did not correct it: 'you were right to' (right-to branch; then a second kiss, hers, thought about first) or his hand and nothing said (hand branch)", "he asked whether it gets too much back there; he waited when she asked him to"]
      hiding: ["what she had planned for 'later' (the kiss was meant to come with thought, at a time of her choosing); the plan itself", "that she wants him to look at the cardigan one the way he looked at the suit one (said, then 'if you want')", "her list; still nothing of it, though 'I had it planned' is the first sign"]
      address: "in the suit: no 'sorry', no stutter, 'you're staring, that's allowed', 'watch'; out of it, behind the curtain: 'S-sorry', 'please— please wait here'; 'you' throughout"
      relationship: "first kiss, hers, behind the curtain before she could think; a second on the right-to branch, hers again, on purpose; or her forehead on his shoulder; he is the one person who knows both of her; she asked him to wait and he did"
      outfit: bunny
      last_seen: convention_hall
  flags_set: {yuki_step: 4}
  affection_delta: {yuki: +2}
  threads: ["yuki +1 for 'You're not saying sorry.' and +1 for 'You were right to.' (default path: both); 'You're taller', 'It's finished, then' and 'Give me your hand' give none", "the kiss: hers, behind the curtain, before she thought; right-to branch: a second, slower, thought about first, 'so it counts', and she laughed into it; hand branch: no second kiss, her forehead on his shoulder", "the two of her: the one in the suit (no stutter, no sorry, counts the people looking) and the one in the cardigan (back at five); he is the only one who knows both; she wants him to look at the cardigan one the same way, 'so it's fair'", "the suit is finished (sewn after the bridge, the tail all night) and has been worn in a hall where nobody knows her, with him there", "behind the stage curtain is where she waits when it is too much; 'and then I go back out, that's the whole trick'", "'I had it planned': she plans; the suit does not; first sign of the list (s05)", "she went to change and asked him to wait five minutes; the scene ends with him waiting among the stacked chairs; she is in bunny at the end and will be in casual next", "the asking took three tries on the stairs and a text that ended 'You don't have to' and then 'Please come'; he sent one word"]
